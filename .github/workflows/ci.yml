name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: tests + model gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -e .
      - name: tests (including a real stdio MCP session)
        run: pytest -q
      - name: walk-forward backtest (fails if the model stops beating the baselines)
        run: python -m matchday.backtest --check
      - name: the backtest committed is the backtest the code produces
        run: git diff --exit-code reports/backtest.json
